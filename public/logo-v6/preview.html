<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TalkBack Logo v6 — Self-dialogue concepts</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0c0c0c; color: #eee; padding: 28px 20px 48px; }
    h1 { font-size: 1.2rem; margin: 0 0 4px; font-weight: 600; }
    .sub { color: #777; font-size: 0.82rem; margin: 0 0 32px; max-width: 720px; line-height: 1.55; }
    section { margin-bottom: 36px; }
    h2 { font-size: 0.95rem; color: #6AEBA8; margin: 0 0 4px; font-weight: 600; }
    .theme-desc { font-size: 0.72rem; color: #555; margin: 0 0 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; max-width: 920px; }
    .card { background: #161616; border: 1px solid #2a2a2a; border-radius: 14px; padding: 16px 12px 12px; text-align: center; }
    .card svg { width: 88px; height: 88px; display: block; margin: 0 auto 10px; }
    .name { font-size: 0.75rem; font-weight: 600; color: #ccc; }
    .desc { font-size: 0.65rem; color: #666; margin-top: 3px; line-height: 1.35; }
    .palette { font-size: 0.68rem; color: #555; margin-bottom: 28px; }
  </style>
</head>
<body>
  <h1>TalkBack Logo v6</h1>
  <p class="sub">독백 · 메아리 · 되물음 · 또 다른 나 · 추상 — 테마별 3안 (총 15). TalkBack mint + 딥 차콜 기본, 테마마다 포인트 색 살짝 다름.</p>
  <p class="palette">Echo: mint layers · Mono: pale mint · Back: mint+coral · Self: dual mint · Abstract: white+mist</p>
  <div id="root"></div>
  <script>
    const themes = [
      {
        id: 'echo',
        title: '메아리 Echo',
        desc: '한 말이 돌아와 울림',
        cards: [
          { id: 'v6-echo-01', name: '동심 잔향', desc: '점에서 왼쪽으로 퍼지는 3겹 원' },
          { id: 'v6-echo-02', name: '반사 파도', desc: '파도가 벽에 부딪혀 되돌아옴' },
          { id: 'v6-echo-03', name: '공명 호', desc: '같은 중심, 어긋난 두 곡선' },
        ],
      },
      {
        id: 'mono',
        title: '독백 Monologue',
        desc: '속으로만, 밖으로 안 나감',
        cards: [
          { id: 'v6-mono-01', name: '열린 괄호', desc: '( … 속말' },
          { id: 'v6-mono-02', name: '점선 속말', desc: '희미한 말풍선 테두리' },
          { id: 'v6-mono-03', name: '속마음 점', desc: '원 안 한 점 — 대화 상대=나' },
        ],
      },
      {
        id: 'back',
        title: '되물음 Talk Back',
        desc: '질문이 돌아와 답이 됨',
        cards: [
          { id: 'v6-back-01', name: '물음 ◀', desc: '? 꼬리가 되돌아감' },
          { id: 'v6-back-02', name: '핑퐁', desc: '짧은 왕복 궤적' },
          { id: 'v6-back-03', name: '거울 대칭', desc: '위·아래 같은 실루엣' },
        ],
      },
      {
        id: 'self',
        title: '또 다른 나',
        desc: '같은 사람, 두 목소리',
        cards: [
          { id: 'v6-self-01', name: '겹친 원', desc: '20% 겹친 쌍둥이' },
          { id: 'v6-self-02', name: '그림자', desc: '실체 + 옅은 복제' },
          { id: 'v6-self-03', name: '∞ 루프', desc: '끝없는 자기 대화' },
        ],
      },
      {
        id: 'abs',
        title: '추상 Abstract',
        desc: '미니멀 기하 — 아이콘용',
        cards: [
          { id: 'v6-abs-01', name: 'Breath', desc: '숨 고르듯 이중 호' },
          { id: 'v6-abs-02', name: 'Pause', desc: '멈칫 | | ◀' },
          { id: 'v6-abs-03', name: 'Loopback', desc: '출력이 입력으로' },
        ],
      },
    ];

    const svgs = {
      'v6-echo-01': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#141414"/><circle cx="40" cy="32" r="4" fill="#6AEBA8"/><circle cx="40" cy="32" r="11" stroke="#6AEBA8" stroke-width="2" opacity="0.55"/><circle cx="40" cy="32" r="18" stroke="#6AEBA8" stroke-width="1.5" opacity="0.3"/><circle cx="40" cy="32" r="25" stroke="#6AEBA8" stroke-width="1" opacity="0.15"/><path d="M 8 32 H 28" stroke="#6AEBA8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/></svg>`,
      'v6-echo-02': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#141414"/><path d="M 8 36 Q 20 20 32 32 T 56 28" stroke="#6AEBA8" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M 56 28 Q 44 44 32 32 T 8 36" stroke="#6AEBA8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45"/><line x1="8" y1="12" x2="8" y2="52" stroke="#6AEBA8" stroke-width="1" opacity="0.25"/></svg>`,
      'v6-echo-03': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#141414"/><path d="M 48 18 Q 28 32 48 46" stroke="#6AEBA8" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M 44 22 Q 30 32 44 42" stroke="#8EF0C5" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/></svg>`,
      'v6-mono-01': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#12181a"/><path d="M 22 16 Q 14 32 22 48" stroke="#A8F5D4" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M 28 24 L 46 24" stroke="#A8F5D4" stroke-width="2" stroke-linecap="round" opacity="0.35"/><path d="M 28 32 L 42 32" stroke="#A8F5D4" stroke-width="2" stroke-linecap="round" opacity="0.25"/><path d="M 28 40 L 38 40" stroke="#A8F5D4" stroke-width="2" stroke-linecap="round" opacity="0.2"/><circle cx="50" cy="32" r="2" fill="#A8F5D4" opacity="0.5"/></svg>`,
      'v6-mono-02': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#12181a"/><rect x="14" y="18" width="36" height="28" rx="10" stroke="#A8F5D4" stroke-width="2" stroke-dasharray="5 4" fill="none" opacity="0.7"/><path d="M 14 32 Q 8 32 8 38 L 8 42" stroke="#A8F5D4" stroke-width="2" stroke-dasharray="4 3" fill="none" opacity="0.5"/><circle cx="32" cy="32" r="3" fill="#A8F5D4" opacity="0.9"/></svg>`,
      'v6-mono-03': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#12181a"/><circle cx="32" cy="32" r="22" stroke="#A8F5D4" stroke-width="2.5" fill="none" opacity="0.35"/><circle cx="32" cy="32" r="5" fill="#A8F5D4"/><circle cx="32" cy="32" r="12" stroke="#A8F5D4" stroke-width="1" opacity="0.15"/></svg>`,
      'v6-back-01': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#141414"/><path d="M 44 14 Q 44 32 36 32 Q 28 32 28 40" stroke="#6AEBA8" stroke-width="4.5" stroke-linecap="round" fill="none"/><circle cx="44" cy="14" r="3" fill="#FF9B7A"/><path d="M 12 32 L 24 24 L 24 40 Z" fill="#6AEBA8"/></svg>`,
      'v6-back-02': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#141414"/><path d="M 48 32 Q 36 20 24 32 Q 12 44 24 32" stroke="#6AEBA8" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="48" cy="32" r="3.5" fill="#FF9B7A"/><circle cx="12" cy="32" r="3.5" fill="#6AEBA8" opacity="0.7"/></svg>`,
      'v6-back-03': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#141414"/><path d="M 20 22 Q 32 14 44 22 L 44 26 Q 32 18 20 26 Z" fill="#6AEBA8" opacity="0.85"/><path d="M 20 38 Q 32 46 44 38 L 44 42 Q 32 50 20 42 Z" fill="#FF9B7A" opacity="0.55"/><line x1="32" y1="28" x2="32" y2="36" stroke="#6AEBA8" stroke-width="1.5" opacity="0.3"/></svg>`,
      'v6-self-01': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#0f1412"/><circle cx="28" cy="32" r="18" stroke="#6AEBA8" stroke-width="4" fill="none"/><circle cx="36" cy="32" r="18" stroke="#4BC992" stroke-width="4" fill="none" opacity="0.75"/></svg>`,
      'v6-self-02': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#0f1412"/><ellipse cx="38" cy="32" rx="14" ry="18" fill="#4BC992" opacity="0.25"/><ellipse cx="30" cy="32" rx="14" ry="18" fill="#6AEBA8" opacity="0.9"/></svg>`,
      'v6-self-03': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#0f1412"/><path d="M 18 32 C 18 20 28 14 32 22 C 36 30 46 30 46 32 C 46 44 36 50 32 42 C 28 34 18 34 18 32 Z" stroke="#6AEBA8" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M 32 22 L 32 42" stroke="#4BC992" stroke-width="2" opacity="0.5"/></svg>`,
      'v6-abs-01': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#111111"/><path d="M 12 36 Q 32 18 52 36" stroke="#E8FFF4" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/><path d="M 12 40 Q 32 26 52 40" stroke="#6AEBA8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45"/></svg>`,
      'v6-abs-02': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#111111"/><rect x="22" y="20" width="4" height="24" rx="2" fill="#E8FFF4"/><rect x="30" y="20" width="4" height="24" rx="2" fill="#E8FFF4" opacity="0.7"/><path d="M 14 32 L 22 26 L 22 38 Z" fill="#6AEBA8"/></svg>`,
      'v6-abs-03': `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#111111"/><path d="M 44 14 A 18 18 0 1 1 44 50" stroke="#6AEBA8" stroke-width="4.5" stroke-linecap="round" fill="none"/><path d="M 20 32 L 44 32" stroke="#E8FFF4" stroke-width="3" stroke-linecap="round"/><path d="M 20 32 L 28 26 L 28 38 Z" fill="#6AEBA8"/></svg>`,
    };

    const root = document.getElementById('root');
    themes.forEach((t) => {
      const sec = document.createElement('section');
      sec.innerHTML = `<h2>${t.title}</h2><p class="theme-desc">${t.desc}</p><div class="grid"></div>`;
      const grid = sec.querySelector('.grid');
      t.cards.forEach((c) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = svgs[c.id] + `<div class="name">${c.name}</div><div class="desc">${c.desc}</div>`;
        grid.appendChild(card);
      });
      root.appendChild(sec);
    });
  </script>
</body>
</html>
