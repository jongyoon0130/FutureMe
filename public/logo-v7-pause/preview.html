<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TalkBack — Pause · 되물어라 (10)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0a0a0a; color: #eee; padding: 28px 20px 56px; }
    h1 { font-size: 1.15rem; margin: 0 0 6px; font-weight: 600; }
    .sub { color: #777; font-size: 0.82rem; margin: 0 0 8px; max-width: 680px; line-height: 1.55; }
    .tag { display: inline-block; font-size: 0.68rem; color: #6AEBA8; border: 1px solid #6AEBA844; padding: 3px 8px; border-radius: 99px; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; max-width: 980px; }
    .card { background: #141414; border: 1px solid #262626; border-radius: 16px; padding: 18px 14px 14px; text-align: center; }
    .card svg { width: 96px; height: 96px; display: block; margin: 0 auto 12px; }
    .name { font-size: 0.78rem; font-weight: 600; color: #f0f0f0; }
    .desc { font-size: 0.67rem; color: #666; margin-top: 4px; line-height: 1.4; }
    .ref { margin-top: 32px; padding-top: 24px; border-top: 1px solid #222; max-width: 980px; }
    .ref h2 { font-size: 0.8rem; color: #555; margin: 0 0 12px; font-weight: 500; }
    .ref svg { width: 64px; height: 64px; opacity: 0.5; }
  </style>
</head>
<body>
  <h1>Pause · 되물어라</h1>
  <p class="sub">◀ 돌아봄 + ⏸ 멈춤 — “잠깐 멈추고 나에게 되묻는다.” mint ◀ · white bars · #141414</p>
  <span class="tag">v7 · 10 candidates</span>
  <div class="grid" id="grid"></div>
  <div class="ref">
    <h2>Reference (v6-abs-02 base)</h2>
    <svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#141414"/><rect x="22" y="20" width="4" height="24" rx="2" fill="#F5F5F5"/><rect x="30" y="20" width="4" height="24" rx="2" fill="#F5F5F5" opacity="0.85"/><path d="M 14 32 L 22 26 L 22 38 Z" fill="#6AEBA8"/></svg>
  </div>
  <script>
    const M = '#6AEBA8', W = '#F5F5F5', BG = '#141414';
    const items = [
      { id: 'p01', name: '01 · Classic', desc: '기본 비율 — ◀ + || 균형' },
      { id: 'p02', name: '02 · Bold', desc: '막대 굵게, ◀ 크게 — 아이콘용' },
      { id: 'p03', name: '03 · Tight', desc: '간격 좁힘 — 한 덩어리' },
      { id: 'p04', name: '04 · Circle', desc: '원 안에 수납' },
      { id: 'p05', name: '05 · Pill bars', desc: '둥근 캡슐 막대' },
      { id: 'p06', name: '06 · Reverse', desc: '|| 먼저 → ◀ (멈춘 뒤 되묻기)' },
      { id: 'p07', name: '07 · Chevron', desc: '채움 ◀ + 얇은 ||' },
      { id: 'p08', name: '08 · Dot breath', desc: '|| 사이 점 — 숨 고르기' },
      { id: 'p09', name: '09 · Block', desc: '사각 블록 + ◀ (앱 아이콘)' },
      { id: 'p10', name: '10 · Soft', desc: '라운드 ◀ + 짧은 막대' },
    ];
    const svgs = {
      p01: `<svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="${BG}"/><path d="M 13 32 L 23 24 L 23 40 Z" fill="${M}"/><rect x="26" y="20" width="4.5" height="24" rx="2" fill="${W}"/><rect x="34" y="20" width="4.5" height="24" rx="2" fill="${W}" opacity="0.88"/></svg>`,
      p02: `<svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="${BG}"/><path d="M 10 32 L 24 21 L 24 43 Z" fill="${M}"/><rect x="28" y="17" width="6" height="30" rx="3" fill="${W}"/><rect x="38" y="17" width="6" height="30" rx="3" fill="${W}" opacity="0.9"/></svg>`,
      p03: `<svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="${BG}"/><path d="M 16 32 L 24 26 L 24 38 Z" fill="${M}"/><rect x="26" y="22" width="5" height="20" rx="2.5" fill="${W}"/><rect x="33" y="22" width="5" height="20" rx="2.5" fill="${W}" opacity="0.88"/></svg>`,
      p04: `<svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="${BG}"/><circle cx="32" cy="32" r="22" stroke="${M}" stroke-width="1.5" opacity="0.35" fill="none"/><path d="M 15 32 L 23 26 L 23 38 Z" fill="${M}"/><rect x="26" y="21" width="4" height="22" rx="2" fill="${W}"/><rect x="33" y="21" width="4" height="22" rx="2" fill="${W}" opacity="0.88"/></svg>`,
      p05: `<svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="${BG}"/><path d="M 12 32 L 22 25 L 22 39 Z" fill="${M}"/><rect x="25" y="22" width="5" height="20" rx="10" fill="${W}"/><rect x="34" y="22" width="5" height="20" rx="10" fill="${W}" opacity="0.88"/></svg>`,
      p06: `<svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="${BG}"/><rect x="14" y="20" width="4.5" height="24" rx="2" fill="${W}"/><rect x="22" y="20" width="4.5" height="24" rx="2" fill="${W}" opacity="0.88"/><path d="M 30 32 L 42 24 L 42 40 Z" fill="${M}"/></svg>`,
      p07: `<svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="${BG}"/><path d="M 11 32 L 26 22 L 26 42 Z" fill="${M}"/><rect x="30" y="24" width="3" height="16" rx="1.5" fill="${W}"/><rect x="36" y="24" width="3" height="16" rx="1.5" fill="${W}" opacity="0.85"/></svg>`,
      p08: `<svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="${BG}"/><path d="M 12 32 L 21 25 L 21 39 Z" fill="${M}"/><rect x="24" y="21" width="4" height="22" rx="2" fill="${W}"/><circle cx="32" cy="32" r="2" fill="${M}" opacity="0.7"/><rect x="35" y="21" width="4" height="22" rx="2" fill="${W}" opacity="0.88"/></svg>`,
      p09: `<svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="16" fill="${BG}"/><rect x="24" y="18" width="28" height="28" rx="8" fill="#1e1e1e" stroke="${M}" stroke-width="1.5" opacity="0.5"/><path d="M 14 32 L 22 26 L 22 38 Z" fill="${M}"/><rect x="28" y="24" width="4" height="16" rx="2" fill="${W}"/><rect x="36" y="24" width="4" height="16" rx="2" fill="${W}" opacity="0.88"/></svg>`,
      p10: `<svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="${BG}"/><path d="M 14 32 L 22 27 Q 24 32 22 37 Z" fill="${M}"/><rect x="26" y="26" width="3.5" height="12" rx="1.75" fill="${W}"/><rect x="32" y="26" width="3.5" height="12" rx="1.75" fill="${W}" opacity="0.85"/></svg>`,
    };
    const grid = document.getElementById('grid');
    items.forEach(it => {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = svgs[it.id] + `<div class="name">${it.name}</div><div class="desc">${it.desc}</div>`;
      grid.appendChild(d);
    });
  </script>
</body>
</html>
